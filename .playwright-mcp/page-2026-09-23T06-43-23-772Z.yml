      - generic [ref=f21e35]:
        - generic [ref=f21e36]:
          - heading "Автопарк работает, а расходы растут. Знакомо?" [level=2] [ref=f21e37]
          - paragraph [ref=f21e38]: Пять вопросов, с которыми к нам чаще всего приходят руководители автопарков, и решение от платформы UZGPS.
        - list [ref=f21e40]:
          - listitem [ref=f21e41]:
            - paragraph [ref=f21e42]: Подозреваете использование корпоративного транспорта в личных целях?
            - paragraph [ref=f21e43]: "Онлайн-контроль передвижения транспорта: местоположение, маршрут и статус каждого объекта в реальном времени."
          - listitem [ref=f21e44]:
            - paragraph [ref=f21e45]: Слишком большой расход топлива?
            - paragraph [ref=f21e46]: Полный учёт поездок, заправок и сливов по датчикам уровня топлива.
          - listitem [ref=f21e47]:
            - paragraph [ref=f21e48]: Сотрудники не выполняют поручения в полном объёме, а клиенты недовольны сроками поставок?
            - paragraph [ref=f21e49]: "Мониторинг посещения запланированных мест: точки интереса, геозоны и события въезда-выезда."
          - listitem [ref=f21e50]:
            - paragraph [ref=f21e51]: Не успеваете оплачивать штрафы сотрудников?
            - paragraph [ref=f21e52]: "Профилактика нарушений: лимиты скорости, резкие разгоны, торможения и повороты, оценка качества вождения."
          - listitem [ref=f21e53]:
            - paragraph [ref=f21e54]: Вам необходима информация в любом месте и в любое время?
            - paragraph [ref=f21e55]: Доступ к системе из браузера и мобильного приложения для Android и iOS.
